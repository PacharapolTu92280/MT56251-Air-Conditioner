<!doctype html>
<html lang="th">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Air Conditioner Management V2.1
  </title>
  <style>
   :root {
  --red:#c8102e;
  --dark:#8f1025;
  --bg:#f5f5f6;
  --line:#e1e2e5;
  --ink:#30343b
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  font:14px 'Segoe UI',Tahoma,sans-serif;
  background:var(--bg);
  color:var(--ink)
}
header {
  background:var(--red);
  color:white;
  padding:20px 26px
}
header h1 {
  margin:0;
  font-size:23px
}
header small {
  opacity:.85
}
.layout {
  display:flex;
  min-height:calc(100vh - 83px)
}
nav {
  background:#fff;
  width:235px;
  padding:14px;
  flex-shrink:0;
  border-right:1px solid var(--line)
}
nav button {
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:white;
  color:#333;
  padding:12px;
  border-radius:8px;
  cursor:pointer
}
nav button.active,nav button:hover {
  background:#fdecef;
  color:var(--dark);
  font-weight:700
}
nav .group {
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  color:#888;
  margin:22px 8px 7px
}
main {
  padding:24px;
  flex:1;
  min-width:0
}
.panel,.card {
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  margin-bottom:16px
}
.cards {
  display:grid;
  grid-template-columns:repeat(4,minmax(120px,1fr));
  gap:12px
}
.card {
  border-top:3px solid var(--red)
}
.card strong {
  display:block;
  font-size:25px;
  margin-top:10px
}
h2 {
  border-left:4px solid var(--red);
  padding-left:12px
}
h3 {
  margin-top:0
}
input,select,textarea {
  width:100%;
  padding:10px;
  border:1px solid #cbd0d6;
  border-radius:7px;
  background:white;
  color:var(--ink);
  font:inherit
}
label {
  display:flex;
  flex-direction:column;
  gap:6px;
  font-weight:600
}
button {
  font:inherit;
  cursor:pointer
}
.btn {
  background:var(--red);
  color:white;
  border:0;
  border-radius:7px;
  padding:10px 14px
}
.btn:hover {
  background:var(--dark)
}
.btn.secondary {
  background:#eee;
  color:#333
}
.fields {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:12px
}
.actions input,.actions select {
  width:auto;
  min-width:170px
}
.muted {
  color:#6f7780;
  font-size:12px
}
.table-wrap {
  overflow-x:auto
}
table {
  width:100%;
  border-collapse:collapse;
  font-size:13px
}
th,td {
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
  white-space:nowrap
}
th {
  background:#f4f4f5
}
td button {
  margin:2px
}
.danger {
  color:#b10d24
}
.calendar {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px
}
.day {
  border:1px solid #ddd;
  border-radius:7px;
  min-height:85px;
  padding:7px;
  overflow:hidden
}
.event {
  background:#fdecef;
  color:#8f1025;
  border-radius:4px;
  padding:3px;
  margin-top:4px;
  font-size:11px
}
.overlay {
  position:fixed;
  inset:0;
  background:#1119;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:10
}
.dialog {
  background:white;
  border-radius:12px;
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  border-top:5px solid var(--red)
}
.message {
  padding:10px;
  color:#9a172c
}
.login {
  max-width:430px;
  margin:10vh auto
}
.notice {
  background:#fff7e6;
  padding:12px;
  border:1px solid #efd9aa;
  border-radius:8px;
  margin-bottom:12px
}
@media(max-width:850px) {
  .layout {
    display:block
  }
  nav {
    width:100%;
    display:flex;
    overflow:auto;
    gap:4px
  }
  nav button {
    white-space:nowrap;
    width:auto
  }
  nav .group {
    display:none
  }
  .cards {
    grid-template-columns:1fr 1fr
  }
}
@media(max-width:550px) {
  .fields,.cards {
    grid-template-columns:1fr
  }
  .day {
    min-height:60px;
    padding:3px
  }
}
  
/* V2.1 Tablet and touch usability enhancements */
html { -webkit-text-size-adjust: 100%; }
body { min-width: 320px; }
button, input, select, textarea { font-size: 16px; }
button, select { touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #df8090; outline-offset: 2px; }
.btn, nav button { min-height: 44px; }
.table-wrap { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.table-wrap table { min-width: 650px; }
.table-wrap th { position: sticky; top: 0; z-index: 1; }
.dialog { max-width: min(760px, calc(100vw - 24px)); overscroll-behavior: contain; }
.dialog .actions { position: sticky; bottom: -24px; background: #fff; padding: 12px 0; margin-bottom: 0; }
.calendar { min-width: 0; }
.day { min-width: 0; overflow-wrap: anywhere; }
.event { overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 851px) and (max-width: 1180px) {
  nav { width: 210px; padding: 10px; }
  main { padding: 18px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 850px) {
  header { padding: 15px 18px; }
  header h1 { font-size: 20px; }
  .layout { display: block; }
  nav { position: sticky; top: 0; z-index: 5; width: 100%; display: flex; align-items: center; overflow-x: auto; white-space: nowrap; gap: 6px; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; background: #fff; }
  nav button { flex: 0 0 auto; width: auto; min-height: 46px; padding: 11px 13px; }
  nav .group { display: none; }
  nav button.active { box-shadow: inset 0 -3px 0 var(--red); }
  main { padding: 16px 12px; }
  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions input, .actions select { min-width: 0; width: 100%; }
  .calendar { gap: 3px; }
  .day { min-height: 78px; padding: 5px; font-size: 12px; }
  .event { font-size: 10px; padding: 3px 2px; }
  .overlay { padding: 10px; }
  .dialog { padding: 18px; max-height: 94dvh; }
  .login { margin: 5vh auto; }
}
@media (max-width: 550px) {
  header h1 { font-size: 18px; }
  .fields { grid-template-columns: 1fr; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card, .panel { padding: 12px; }
  .card strong { font-size: 21px; }
  .day { min-height: 62px; padding: 3px; font-size: 11px; }
  .event { font-size: 9px; }
  .dialog .actions { bottom: -18px; }
}

</style>
 </head>
 <body>
  <header>
   <h1>
    ❄ Air Conditioner Management
   </h1>
   <small>
    V2.1 Online Edition · Tablet Ready · Employee ID Access
   </small>
  </header>
  <div id="root">
  </div>
  <script>
   // Configure ONLY public project URL and anon/publishable key. NEVER put service_role key here.
const CONFIG = {
  SUPABASE_URL: 'https://rpuktjyruypjektegfgb.supabase.co',
  SUPABASE_ANON_KEY: 'PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE'
};

const endpoint=()=>CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/functions/v1/ac-api';

const $=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const today=()=>{const d=new Date();
return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};

const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});

let token=sessionStorage.getItem('ac-v2-token')||'',me=null,tab='Dashboard',store={units:[],dailyChecks:[],pmHistory:[],costs:[]},month=new Date().getMonth(),year=new Date().getFullYear();


async function api(action,payload={}){const res=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'application/json','apikey':CONFIG.SUPABASE_ANON_KEY,...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});
let data=await res.json().catch(()=>({error:'Invalid server response'}));
if(!res.ok)throw Error(data.error||'Request failed');
return data}
const admin=()=>me?.role==='admin';


function error(e){alert(e.message||String(e))}

function loginPage(){ $('#root').innerHTML=`<div class="panel login"><h2>Employee Login</h2><p class="notice">รหัสพนักงานอย่างเดียวไม่ใช่การยืนยันตัวตนที่ปลอดภัย ห้ามใช้ข้อมูลจริงหรือเปิดสู่สาธารณะโดยไม่มีมาตรการเพิ่มเติม</p><form id="loginForm"><label>Employee ID<input id="emp" inputmode="numeric" pattern="[0-9]{3,12}" placeholder="เช่น 02743" required autocomplete="off"></label><p id="loginError" class="danger"></p><button class="btn">Login</button></form></div>`;
$('#loginForm').onsubmit=async e=>{e.preventDefault();
try{const r=await api('login',{employeeId:$('#emp').value.trim()});
token=r.token;
me=r.user;
sessionStorage.setItem('ac-v2-token',token);
await refresh()}catch(ex){$('#loginError').textContent=ex.message}}}

async function refresh(){try{for(const c of Object.keys(store))store[c]=(await api('list',{collection:c})).records;
const r=await api('list',{collection:'units'});
me=r.user;
render()}catch(ex){if(/Session|Login/.test(ex.message)){token='';
sessionStorage.removeItem('ac-v2-token');
loginPage()}else error(ex)}}

function nav(){return `<nav><button class="${tab==='Dashboard'?'active':''}" data-tab="Dashboard">Dashboard</button><div class="group">OPERATIONS</div><button data-tab="Daily Check" class="${tab==='Daily Check'?'active':''}">Daily Check</button><button data-tab="Air Register" class="${tab==='Air Register'?'active':''}">Air Conditioner Register</button><div class="group">MAINTENANCE</div><button data-tab="PM Schedule" class="${tab==='PM Schedule'?'active':''}">PM Schedule</button><button data-tab="Maintenance" class="${tab==='Maintenance'?'active':''}">Maintenance History</button><div class="group">MANAGEMENT</div><button data-tab="Costs" class="${tab==='Costs'?'active':''}">Cost Management</button><button data-tab="Reports" class="${tab==='Reports'?'active':''}">Reports & Analytics</button>${admin()?`<div class="group">ADMIN</div><button data-tab="Admin" class="${tab==='Admin'?'active':''}">Admin Management</button>`:''}<div class="group">ACCOUNT</div><button id="logout">Logout (${escapeHtml(me?.employeeId)})</button></nav>`}
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${heads.length}">ไม่มีข้อมูล</td></tr>`}</tbody></table></div>`;

const row=(...cells)=>'<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>';

const btn=(label,action,id)=>`<button class="btn secondary" data-action="${action}" data-id="${escapeHtml(id)}">${label}</button>`;


function render(){let s=store,content='';
const costSum=s.costs.reduce((n,c)=>n+Number(c.amount||0),0);

if(tab==='Dashboard'){let checked=new Set(s.dailyChecks.filter(x=>x.date===today()).map(x=>x.ac));
content=`<h2>Dashboard Overview</h2><div class="cards">${[['Total Air Conditioners',s.units.length],['Normal',s.units.filter(x=>x.status==='Normal').length],['Breakdown',s.units.filter(x=>x.status==='Breakdown').length],['Total Expenses',money(costSum)],['Checked Today',checked.size],['Not Checked',Math.max(0,s.units.length-checked.size)]].map(([a,b])=>`<div class="card">${a}<strong>${b}</strong></div>`).join('')}</div><div class="panel"><h3>Recent Expenses</h3>${expenseTable(s.costs.slice(0,8))}</div>`}
if(tab==='Air Register')content=`<h2>Air Conditioner Register</h2><div class="panel"><div class="actions"><input id="search" placeholder="ค้นหารหัส / สถานที่" oninput="filterRegister()">${admin()?'<button class="btn" data-action="unit">+ เพิ่มแอร์</button>':''}</div><div id="registerTable">${unitTable(s.units)}</div></div>`;

if(tab==='Daily Check')content=`<h2>Daily Check</h2><div class="panel"><h3>บันทึกการตรวจสอบรายวัน</h3><form id="dailyForm" class="fields"><label>Air ID<select name="ac" required>${options(s.units,'id','area')}</select></label><label>วันที่<input name="date" type="date" value="${today()}" required></label><label>ผู้ตรวจ<input name="inspector" required maxlength="100"></label><label>สถานะการทำงาน<select name="running"><option>Normal</option><option>Not Running</option><option>Abnormal</option></select></label><label>อุณหภูมิ °C<input name="temp" type="number" step="0.1"></label><label>เสียงผิดปกติ<select name="noise"><option>No</option><option>Yes</option></select></label><label>น้ำรั่ว<select name="leak"><option>No</option><option>Yes</option></select></label><label>แผ่นกรอง<select name="filter"><option>Clean</option><option>Dirty</option><option>Not Checked</option></select></label><label>หมายเหตุ<input name="note"></label><label>ผลตรวจ<select name="result"><option>Normal</option><option>Abnormal</option></select></label><button class="btn" ${s.units.length?'':'disabled'}>Save Daily Check</button></form></div><div class="panel"><h3>Daily Check History</h3>${table(['Date','Air ID','Inspector','Running','Temp','Noise','Leak','Filter','Result','Remark'],s.dailyChecks.map(x=>row(...['date','ac','inspector','running','temp','noise','leak','filter','result','note'].map(k=>escapeHtml(x[k])))))}</div>`;

if(tab==='PM Schedule')content=`<h2>Preventive Maintenance Schedule</h2><div class="panel"><h3>PM Schedule List</h3>${table(['Air ID','Location','Next PM','Status','Action'],[...s.units].sort((a,b)=>String(a.pm||'').localeCompare(String(b.pm||''))).map(x=>row(escapeHtml(x.id),escapeHtml(x.area),escapeHtml(x.pm),escapeHtml(x.status),btn('บันทึก PM','pmDone',x.id)+(admin()?btn('แก้ไขแผน','pmEdit',x.id):''))))}</div><div class="panel"><div class="actions"><button class="btn secondary" data-action="prev">◀</button><h3 id="monthTitle"></h3><button class="btn secondary" data-action="next">▶</button></div><div id="calendar"></div></div><div class="panel"><h3>PM Completion History</h3>${table(['Date','Air ID','Details'],s.pmHistory.map(x=>row(escapeHtml(x.date),escapeHtml(x.ac),escapeHtml(x.note))))}</div>`;

if(tab==='Maintenance')content=`<h2>Maintenance History</h2><div class="panel"><h3>PM Records</h3>${table(['Date','Air ID','Details'],s.pmHistory.map(x=>row(escapeHtml(x.date),escapeHtml(x.ac),escapeHtml(x.note))))}</div><div class="panel"><h3>Repair Expenses</h3>${expenseTable(s.costs.filter(x=>x.type==='Repair'))}</div>`;

if(tab==='Costs')content=`<h2>Cost Management</h2><div class="cards"><div class="card">Total Expenses<strong>${money(costSum)}</strong></div><div class="card">PM<strong>${money(s.costs.filter(x=>x.type==='PM').reduce((n,x)=>n+Number(x.amount),0))}</strong></div><div class="card">Repair<strong>${money(s.costs.filter(x=>x.type==='Repair').reduce((n,x)=>n+Number(x.amount),0))}</strong></div><div class="card">Expense Records<strong>${s.costs.length}</strong></div></div><div class="panel"><h3>เพิ่มค่าใช้จ่าย</h3><form id="costForm" class="fields"><label>Air ID<select name="ac" required>${options(s.units,'id','area')}</select></label><label>วันที่<input name="date" type="date" value="${today()}" required></label><label>ประเภท<select name="type">${['PM','Repair','Parts','Installation','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Amount (THB)<input name="amount" type="number" min="0" step="0.01" required></label><button class="btn" ${s.units.length?'':'disabled'}>บันทึกค่าใช้จ่าย</button></form></div><div class="panel"><h3>Expense Records</h3>${expenseTable(s.costs)}</div>`;

if(tab==='Reports'){const grouped=s.units.map(u=>({id:u.id,area:u.area,sum:s.costs.filter(c=>c.ac===u.id).reduce((n,c)=>n+Number(c.amount),0)}));
content=`<h2>Reports & Analytics</h2><div class="panel"><div class="actions"><button class="btn" data-action="exportUnits">Export Air Register CSV</button><button class="btn" data-action="exportCosts">Export Expense CSV</button><button class="btn" data-action="exportDaily">Export Daily Check CSV</button></div><h3>Cost by Air Conditioner</h3>${table(['Air ID','Location','Total Cost'],grouped.sort((a,b)=>b.sum-a.sum).map(x=>row(escapeHtml(x.id),escapeHtml(x.area),money(x.sum))))}</div>`}
if(tab==='Admin'&&admin())content=`<h2>Admin Management</h2><div class="panel"><h3>เพิ่ม / แก้ไขพนักงาน</h3><form id="memberForm" class="fields"><label>Employee ID<input name="employeeId" pattern="[0-9]{3,12}" required></label><label>Display Name<input name="name" required></label><label>Role<select name="role"><option value="member">Member</option><option value="admin">Admin</option></select></label><label>Account Status<select name="active"><option value="true">Active</option><option value="false">Inactive</option></select></label><button class="btn">Save Member</button></form></div><div class="panel"><h3>Members</h3><div id="memberTable">กำลังโหลด...</div></div>`;

$('#root').innerHTML=`<div class="layout">${nav()}<main><p class="muted">Online database · ${escapeHtml(me?.name||me?.employeeId)} · ${escapeHtml(me?.role)}</p>${content}</main></div>`;

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;
render()});
$('#logout').onclick=async()=>{try{await api('logout')}catch{}token='';
me=null;
sessionStorage.removeItem('ac-v2-token');
loginPage()};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,b.dataset.id));
if(tab==='PM Schedule')calendar();
if(tab==='Admin')loadMembers();
if(tab==='Daily Check')$('#dailyForm').onsubmit=e=>submit(e,'dailyChecks');
if(tab==='Costs')$('#costForm').onsubmit=e=>submit(e,'costs');
if(tab==='Admin')$('#memberForm').onsubmit=saveMember;

}

function options(items,key,desc){return items.map(x=>`<option value="${escapeHtml(x[key])}">${escapeHtml(x[key])} · ${escapeHtml(x[desc])}</option>`).join('')}

function expenseTable(items){return table(['Date','Expense ID','Air ID','Type','Amount (THB)'],items.map(x=>row(escapeHtml(x.date),escapeHtml(x.id),escapeHtml(x.ac),escapeHtml(x.type),money(x.amount))))}

function unitTable(items){return table(['Air ID','Location','Brand','Model','BTU','Status','Next PM','Action'],items.map(x=>row(...['id','area','brand','model','btu','status','pm'].map(k=>escapeHtml(x[k])),admin()?btn('Edit','unit',x.id):'View only')))}

function filterRegister(){let q=$('#search').value.toLowerCase();
$('#registerTable').innerHTML=unitTable(store.units.filter(x=>(x.id+' '+x.area+' '+x.brand).toLowerCase().includes(q)))}

function newId(prefix){return prefix+'-'+crypto.randomUUID()}

async function write(collection,data){await api('upsert',{collection,id:data.id,data});
await refresh()}

async function submit(e,c){e.preventDefault();
const d=Object.fromEntries(new FormData(e.currentTarget));
d.id=newId(c==='costs'?'EXP':'DC');
if(c==='costs'){d.amount=Number(d.amount);
if(!Number.isFinite(d.amount)||d.amount<0)return alert('จำนวนเงินไม่ถูกต้อง')}else{if(d.running!=='Normal'||d.noise==='Yes'||d.leak==='Yes'||d.filter==='Dirty')d.result='Abnormal';
d.temp=d.temp===''?'':Number(d.temp)}try{await write(c,d)}catch(ex){error(ex)}}

function openForm(title,fields,initial,save){let overlay=document.createElement('div');
overlay.className='overlay';
overlay.innerHTML=`<div class="dialog"><h2>${escapeHtml(title)}</h2><form id="editForm"><div class="fields">${fields.map(([key,label,type,opts])=>`<label>${label}${type==='select'?`<select name="${key}">${opts.map(o=>`<option value="${escapeHtml(o)}" ${initial[key]===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}">${escapeHtml(initial[key])}</textarea>`:`<input name="${key}" type="${type}" value="${escapeHtml(initial[key])}" ${['id','area','pm','date'].includes(key)?'required':''} ${key==='id'&&initial._existing?'readonly':''}>`}</label>`).join('')}</div><p class="message" id="formError"></p><div class="actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button class="btn">Save</button></div></form></div>`;
document.body.append(overlay);
overlay.querySelector('#cancel').onclick=()=>overlay.remove();
overlay.querySelector('form').onsubmit=async e=>{e.preventDefault();
let d=Object.fromEntries(new FormData(e.target));
try{await save(d);
overlay.remove()}catch(ex){overlay.querySelector('#formError').textContent=ex.message}}}

function calendar(){const first=new Date(year,month,1),offset=first.getDay(),days=new Date(year,month+1,0).getDate();
$('#monthTitle').textContent=first.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
let html=['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<div style="text-align:center">${x}</div>`).join('');
for(let i=0;
i<Math.ceil((days+offset)/7)*7;
i++){let n=i-offset+1,date=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
html+=`<div class="day">${n>0&&n<=days?`<b>${n}</b>${store.units.filter(x=>x.pm===date).map(x=>`<div class="event">${escapeHtml(x.id)}</div>`).join('')}`:''}</div>`}$('#calendar').innerHTML='<div class="calendar">'+html+'</div>'}

function act(a,id){if(a==='prev'||a==='next'){const d=new Date(year,month+(a==='prev'?-1:1),1);
year=d.getFullYear();
month=d.getMonth();
calendar();
return}if(a.startsWith('export'))return exportCSV(a);
const u=store.units.find(x=>x.id===id);
if(a==='unit'){const fields=[['id','Air ID','text'],['area','Location','text'],['brand','Brand','text'],['model','Model','text'],['serial','Serial Number','text'],['type','Type','select',['Wall Mounted','Cassette','Ceiling Suspended','Ducted','Package','Chiller','Other']],['btu','BTU','number'],['building','Building','text'],['floor','Floor','text'],['installed','Installation Date','date'],['status','Status','select',['Normal','Maintenance','Breakdown','Inactive']],['lastPM','Last PM','date'],['pm','Next PM','date'],['frequency','PM Frequency (months)','number'],['responsible','Responsible','text'],['remark','Remark','textarea']];
openForm(id?'Edit Air Conditioner':'Register New Air Conditioner',fields,{status:'Normal',type:'Wall Mounted',frequency:'6',pm:today(),...u,_existing:!!u},async d=>{d.id=d.id.trim().toUpperCase();
if(!/^[A-Z0-9_-]{2,30}$/.test(d.id))throw Error('Air ID ไม่ถูกต้อง');
if(store.units.some(x=>x.id===d.id&&x.id!==id))throw Error('Air ID ซ้ำ');
d.btu=Number(d.btu||0);
d.frequency=Number(d.frequency||0);
await write('units',d)});
return}
if(a==='pmEdit'||a==='pmDone'){openForm(a==='pmDone'?'บันทึกทำ PM':'อัปเดตแผน PM',a==='pmDone'?[['date','วันที่ทำ PM','date'],['note','รายละเอียดงาน','textarea'],['pm','Next PM','date']]:[['pm','Next PM','date'],['frequency','PM Frequency','number']],{date:today(),note:'',pm:u.pm,frequency:u.frequency||6},async d=>{if(a==='pmDone'){await write('pmHistory',{id:newId('PM'),ac:id,date:d.date,note:d.note});
if(admin())await api('upsert',{collection:'units',id,data:{...u,pm:d.pm,lastPM:d.date}});
await refresh()}else await write('units',{...u,pm:d.pm,frequency:Number(d.frequency)})});
return}}

async function loadMembers(){try{const r=await api('members');
$('#memberTable').innerHTML=table(['Employee ID','Name','Role','Active','Action'],r.members.map(m=>row(escapeHtml(m.employee_id),escapeHtml(m.display_name),escapeHtml(m.role),m.active?'Yes':'No',`<button class="btn secondary" data-member="${escapeHtml(m.employee_id)}">Edit</button>`)));
document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{const m=r.members.find(x=>x.employee_id===b.dataset.member),f=$('#memberForm');
f.elements.employeeId.value=m.employee_id;
f.elements.name.value=m.display_name;
f.elements.role.value=m.role;
f.elements.active.value=String(m.active)})}catch(ex){error(ex)}}

async function saveMember(e){e.preventDefault();
const d=Object.fromEntries(new FormData(e.target));
try{await api('setMember',{member:{employeeId:d.employeeId,name:d.name,role:d.role,active:d.active==='true'}});
e.target.reset();
loadMembers()}catch(ex){error(ex)}}

function exportCSV(type){let rows;
if(type==='exportUnits')rows=[['Air ID','Location','Brand','Model','BTU','Status','Next PM'],...store.units.map(x=>[x.id,x.area,x.brand,x.model,x.btu,x.status,x.pm])];
if(type==='exportCosts')rows=[['Date','Expense ID','Air ID','Type','Amount'],...store.costs.map(x=>[x.date,x.id,x.ac,x.type,x.amount])];
if(type==='exportDaily')rows=[['Date','Air ID','Inspector','Result','Remark'],...store.dailyChecks.map(x=>[x.date,x.ac,x.inspector,x.result,x.note])];
const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
a.href=url;
a.download=type+'.csv';
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000)}
if(CONFIG.SUPABASE_URL.startsWith('PASTE_') || !CONFIG.SUPABASE_ANON_KEY.startsWith('sb_publishable_')){$('#root').innerHTML='<div class="panel login"><h2>Setup Required</h2><p>กรุณากำหนด SUPABASE_URL และ SUPABASE_ANON_KEY ใน index.html ตาม README ก่อนใช้งาน</p></div>'}else if(token)refresh();
else loginPage();

  </script>
